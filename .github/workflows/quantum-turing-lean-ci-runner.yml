name: Quantum Turing Patterns Lean CI runner

on:
  push:
    branches: [agent/lean-verification-20260720]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize isolated Lean package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lean-ci
          printf '%s\n' 'leanprover/lean4:v4.32.0' > .lean-ci/lean-toolchain
          cat > .lean-ci/lakefile.toml <<'EOF'
          name = "qtp_lean_ci"
          version = "0.1.0"
          defaultTargets = ["QuantumTuringPatternsVerification"]

          [[lean_lib]]
          name = "QuantumTuringPatternsVerification"

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.32.0"
          EOF
          awk '
            /base64 --decode/ { capture = 1; next }
            capture && /^[[:space:]]*EOF[[:space:]]*$/ { exit }
            capture { print }
          ' .github/workflows/quantum-turing-lean-ci.yml \
            | tr -d '[:space:]' \
            | base64 --decode \
            | gzip --decompress \
            > .lean-ci/QuantumTuringPatternsVerification.lean
          test "$(wc -l < .lean-ci/QuantumTuringPatternsVerification.lean)" -eq 1324
          sha256sum .lean-ci/QuantumTuringPatternsVerification.lean
          if grep -RInE '\b(sorry|admit)\b|^[[:space:]]*(axiom|unsafe)\b' \
              .lean-ci/QuantumTuringPatternsVerification.lean; then
            exit 1
          fi

      - name: Install Lean and make the first build attempt
        continue-on-error: true
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .lean-ci
          build: true
          use-mathlib-cache: true
          leanchecker: false
          nanoda: false

      - name: Re-run lake build and capture the complete log
        shell: bash
        run: |
          set +e
          cd .lean-ci
          lake build > ../lake-build.log 2>&1
          status=$?
          tail -n 160 ../lake-build.log
          exit "$status"

      - name: Upload lake build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtp-lake-build-log
          path: lake-build.log
          if-no-files-found: warn
