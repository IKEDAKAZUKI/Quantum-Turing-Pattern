name: Quantum Turing Patterns Lean verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize isolated Lean package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lean-ci
          cat > .lean-ci/lean-toolchain <<'EOF'
          leanprover/lean4:v4.32.0
          EOF
          cat > .lean-ci/lakefile.toml <<'EOF'
          name = "qtp_lean_ci"
          version = "0.1.0"
          defaultTargets = ["QuantumTuringPatternsVerification"]

          [[lean_lib]]
          name = "QuantumTuringPatternsVerification"

          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.32.0"
          EOF
          base64 --decode <<'EOF' | gzip --decompress > .lean-ci/QuantumTuringPatternsVerification.lean
