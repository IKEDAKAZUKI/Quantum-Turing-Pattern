name: Final repository language audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-repository-text-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan all tracked files, comments, and notebook text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, io, json, re, subprocess, tokenize

          report = Path('.repository-language-final.txt')
          excluded = {
              '.github/workflows/full-repository-text-audit.yml',
              '.repository-language-final.txt',
          }
          files = sorted(
              p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
              if p and p not in excluded
          )
          hard = re.compile(
              r'(?i)(?:\bchatgpt\b|\bopenai\b|\bllm\b|large language model|'
              r'ai[- ]assisted|generative[- ]ai|machine[- ]generated|generated draft|'
              r'feedback implementation|repair note|revision history|private development|'
              r'internal memo|conversation transcript|prompt history|scratchpad|sealed run|'
              r'artifact id|run id|\btodo\b|\bfixme\b|\btbd\b|placeholder|replace me|'
              r'insert here|XXXX|the corresponding article result|SCOPE\.md|museum exhibit|'
              r'plotting certificate|Turing certificate helpers|time-step robustness|'
              r'Quantum Turing Patterns: A Constructive Quantum Markov Realization|'
              r'Quantum Turing Patterns in Lindblad Lattices|2707\.XXXX)'
          )
          style = re.compile(
              r'(?i)\b(?:delve|seamless|comprehensive|leverage|harness|pivotal|intricate|'
              r'realm|landscape|underscore|facilitate|notably|importantly|moreover|'
              r'furthermore|architecture|certificate|protocol)\b|'
              r'(?i)\bfor completeness\b|it is worth (?:noting|emphasizing)|'
              r'\bthis gives (?:the|a)\b|\bwe first\b'
          )

          hard_hits, style_hits, binary_hits = [], [], []
          text_count = binary_count = 0
          python_comments = python_docstrings = lean_comments = 0
          notebook_markdown = notebook_comments = 0

          for rel in files:
              path = Path(rel)
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8') if b'\0' not in data[:8192] else None
              except UnicodeDecodeError:
                  text = None
              if text is None:
                  binary_count += 1
                  for raw in re.findall(rb'[\x20-\x7e]{8,}', data):
                      value = raw.decode('latin-1', errors='ignore')
                      if hard.search(value):
                          binary_hits.append((rel, value[:240]))
                  continue

              text_count += 1
              lines = text.splitlines()
              for match in hard.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  hard_hits.append((rel, line, lines[line - 1].strip()[:300]))
              for match in style.finditer(text):
                  line = text.count('\n', 0, match.start()) + 1
                  style_hits.append((rel, line, lines[line - 1].strip()[:300]))

              if path.suffix == '.py':
                  try:
                      python_comments += sum(
                          tok.type == tokenize.COMMENT
                          for tok in tokenize.generate_tokens(io.StringIO(text).readline)
                      )
                  except Exception:
                      pass
                  try:
                      tree = ast.parse(text)
                      python_docstrings += sum(
                          bool(ast.get_docstring(node, clean=False))
                          for node in ast.walk(tree)
                          if isinstance(node, (ast.Module, ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                      )
                  except SyntaxError as exc:
                      hard_hits.append((rel, exc.lineno or 1, f'Python syntax error: {exc}'))
              elif path.suffix == '.lean':
                  lean_comments += len(re.findall(r'(?m)^\s*--', text)) + len(re.findall(r'/-[\s\S]*?-/', text))
              elif path.suffix == '.ipynb':
                  try:
                      notebook = json.loads(text)
                      for cell in notebook.get('cells', []):
                          source = ''.join(cell.get('source', []))
                          if cell.get('cell_type') == 'markdown':
                              notebook_markdown += 1
                          elif cell.get('cell_type') == 'code':
                              try:
                                  notebook_comments += sum(
                                      tok.type == tokenize.COMMENT
                                      for tok in tokenize.generate_tokens(io.StringIO(source).readline)
                                  )
                              except Exception:
                                  pass
                  except Exception as exc:
                      hard_hits.append((rel, 1, f'Notebook parse error: {exc!r}'))

          out = [
              'FINAL REPOSITORY LANGUAGE AUDIT',
              '=' * 72,
              f'Tracked files scanned: {len(files)}',
              f'UTF-8 text files: {text_count}',
              f'Binary/non-UTF8 files: {binary_count}',
              f'Python comments: {python_comments}',
              f'Python docstrings: {python_docstrings}',
              f'Lean comment blocks: {lean_comments}',
              f'Notebook markdown cells: {notebook_markdown}',
              f'Notebook code comments: {notebook_comments}',
              f'Hard hits: {len(hard_hits)}',
              f'Binary hard hits: {len(binary_hits)}',
              f'Style-phrase hits: {len(style_hits)}',
              '', '[HARD HITS]',
          ]
          out += [f'{p}:{n}\t{s}' for p, n, s in hard_hits] or ['NONE']
          out += ['', '[BINARY HARD HITS]']
          out += [f'{p}\t{s}' for p, s in binary_hits] or ['NONE']
          out += ['', '[STYLE-PHRASE HITS]']
          out += [f'{p}:{n}\t{s}' for p, n, s in style_hits] or ['NONE']
          out += ['', '[ALL TRACKED FILES]'] + files
          report.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out[:25]))
          if hard_hits or binary_hits:
              raise SystemExit('Repository language audit found hard issues.')
          PY

      - name: Commit audit report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .repository-language-final.txt
          git commit -m "Record final repository language audit"
          git push
