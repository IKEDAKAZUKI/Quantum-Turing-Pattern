name: Full repository text audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-repository-text-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build exhaustive text and comment audit
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import io
          import json
          import pathlib
          import re
          import subprocess
          import tokenize
          from collections import Counter, defaultdict

          ROOT = pathlib.Path('.')
          REPORT = ROOT / '.repository-text-audit.txt'
          SELF = '.github/workflows/full-repository-text-audit.yml'
          REPORT_PATH = '.repository-text-audit.txt'

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          tracked = sorted(p for p in tracked if p and p not in {REPORT_PATH})

          forbidden = {
              'AI_OR_LLM': re.compile(r'(?i)\b(?:chatgpt|openai|large language model|\bllm\b|ai[- ]assisted|generative[- ]ai|machine[- ]generated|generated draft)\b'),
              'INTERNAL_PROCESS': re.compile(r'(?i)\b(?:audit|feedback|repair note|revision history|private development|internal memo|conversation|prompt|scratchpad|sidecar|sealed run|artifact id|run id)\b'),
              'TODO_OR_PLACEHOLDER': re.compile(r'(?i)\b(?:todo|fixme|xxx|tbd|placeholder|replace me|insert here)\b'),
              'INTERNAL_PATH': re.compile(r'(?:/mnt/|/home/|/tmp/|[A-Za-z]:\\\\Users\\\\|github-actions-runner|runner[_-]temp)'),
              'OLD_VERSION': re.compile(r'(?i)(?:\bv\d+\.\d+(?:\.\d+)?\b|\bversion\s+\d+\.\d+(?:\.\d+)?\b|quantum turing patterns-\d+\.\d+\.\d+)'),
          }

          style_phrases = {
              'delve': re.compile(r'(?i)\bdelv(?:e|es|ed|ing)\b'),
              'robust': re.compile(r'(?i)\brobust(?:ly|ness)?\b'),
              'comprehensive': re.compile(r'(?i)\bcomprehensive(?:ly)?\b'),
              'seamless': re.compile(r'(?i)\bseamless(?:ly)?\b'),
              'leverage': re.compile(r'(?i)\bleverag(?:e|es|ed|ing)\b'),
              'harness': re.compile(r'(?i)\bharness(?:es|ed|ing)?\b'),
              'pivotal': re.compile(r'(?i)\bpivotal\b'),
              'intricate': re.compile(r'(?i)\bintricate\b'),
              'landscape': re.compile(r'(?i)\blandscape\b'),
              'realm': re.compile(r'(?i)\brealm\b'),
              'underscore': re.compile(r'(?i)\bunderscor(?:e|es|ed|ing)\b'),
              'facilitate': re.compile(r'(?i)\bfacilitat(?:e|es|ed|ing)\b'),
              'notably': re.compile(r'(?i)\bnotably\b'),
              'importantly': re.compile(r'(?i)\bimportantly\b'),
              'moreover': re.compile(r'(?i)\bmoreover\b'),
              'furthermore': re.compile(r'(?i)\bfurthermore\b'),
              'for_completeness': re.compile(r'(?i)\bfor completeness\b'),
              'worth_noting': re.compile(r'(?i)\bit is worth (?:noting|emphasizing)\b'),
              'this_gives': re.compile(r'(?i)\bthis gives (?:the|a)\b'),
              'we_first': re.compile(r'(?i)\bwe first\b'),
              'in_conclusion': re.compile(r'(?i)\bin conclusion\b'),
              'framework': re.compile(r'(?i)\bframework\b'),
              'architecture': re.compile(r'(?i)\barchitecture\b'),
              'pipeline': re.compile(r'(?i)\bpipeline\b'),
              'certificate': re.compile(r'(?i)\bcertificate\b'),
              'protocol': re.compile(r'(?i)\bprotocol\b'),
          }

          text_ext = {
              '.md', '.rst', '.txt', '.py', '.lean', '.toml', '.yaml', '.yml', '.json',
              '.ipynb', '.sh', '.bash', '.zsh', '.ps1', '.html', '.htm', '.css', '.js',
              '.ts', '.tsx', '.jsx', '.csv', '.tsv', '.cff', '.gitignore', '.gitattributes',
              '.tex', '.bib', '.cfg', '.ini', '.lock', '.xml'
          }

          def decode_text(path: pathlib.Path, data: bytes):
              if b'\x00' in data[:8192]:
                  return None
              try:
                  return data.decode('utf-8')
              except UnicodeDecodeError:
                  return None

          def line_no(text: str, pos: int) -> int:
              return text.count('\n', 0, pos) + 1

          def extract_python(path: str, text: str):
              blocks = []
              try:
                  for tok in tokenize.generate_tokens(io.StringIO(text).readline):
                      if tok.type == tokenize.COMMENT:
                          blocks.append((tok.start[0], 'comment', tok.string.lstrip('#').strip()))
              except Exception as exc:
                  blocks.append((1, 'tokenize_error', repr(exc)))
              try:
                  tree = ast.parse(text)
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.Module, ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          ds = ast.get_docstring(node, clean=False)
                          if ds:
                              blocks.append((getattr(node, 'lineno', 1), 'docstring', ds.strip()))
              except Exception as exc:
                  blocks.append((1, 'ast_error', repr(exc)))
              return blocks

          def extract_notebook(path: str, text: str):
              blocks = []
              try:
                  nb = json.loads(text)
                  for i, cell in enumerate(nb.get('cells', []), 1):
                      source = ''.join(cell.get('source', []))
                      if cell.get('cell_type') == 'markdown':
                          blocks.append((i, 'markdown_cell', source.strip()))
                      elif cell.get('cell_type') == 'code':
                          try:
                              for tok in tokenize.generate_tokens(io.StringIO(source).readline):
                                  if tok.type == tokenize.COMMENT:
                                      blocks.append((i, 'code_comment', tok.string.lstrip('#').strip()))
                          except Exception:
                              pass
                  metadata = nb.get('metadata', {})
                  if metadata:
                      blocks.append((0, 'notebook_metadata', json.dumps(metadata, ensure_ascii=False, sort_keys=True)))
              except Exception as exc:
                  blocks.append((1, 'notebook_parse_error', repr(exc)))
              return blocks

          def extract_lean(path: str, text: str):
              blocks = []
              for m in re.finditer(r'(?m)^\s*--(.*)$', text):
                  blocks.append((line_no(text, m.start()), 'line_comment', m.group(1).strip()))
              for m in re.finditer(r'/-([\s\S]*?)-/', text):
                  blocks.append((line_no(text, m.start()), 'block_comment', m.group(1).strip()))
              return blocks

          def extract_hash_comments(path: str, text: str):
              blocks = []
              for i, line in enumerate(text.splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith('#') and not stripped.startswith('#!'):
                      blocks.append((i, 'comment', stripped.lstrip('#').strip()))
              return blocks

          text_files = []
          binary_files = []
          forbidden_hits = []
          style_hits = []
          prose_blocks = []
          binary_string_hits = []
          extension_counts = Counter()

          for rel in tracked:
              path = ROOT / rel
              if not path.is_file():
                  continue
              data = path.read_bytes()
              extension_counts[path.suffix.lower() or '<none>'] += 1
              text = decode_text(path, data)
              if text is None:
                  binary_files.append((rel, len(data)))
                  strings = re.findall(rb'[\x20-\x7e]{6,}', data)
                  for raw in strings:
                      s = raw.decode('latin-1', errors='ignore')
                      for name, pat in forbidden.items():
                          if pat.search(s):
                              binary_string_hits.append((rel, name, s[:240]))
                  continue

              text_files.append((rel, len(data), len(text.splitlines())))
              for name, pat in forbidden.items():
                  for m in pat.finditer(text):
                      ln = line_no(text, m.start())
                      snippet = text.splitlines()[ln-1].strip()[:300]
                      forbidden_hits.append((rel, ln, name, snippet))
              for name, pat in style_phrases.items():
                  for m in pat.finditer(text):
                      ln = line_no(text, m.start())
                      snippet = text.splitlines()[ln-1].strip()[:300]
                      style_hits.append((rel, ln, name, snippet))

              suffix = path.suffix.lower()
              blocks = []
              if suffix == '.py':
                  blocks = extract_python(rel, text)
              elif suffix == '.ipynb':
                  blocks = extract_notebook(rel, text)
              elif suffix == '.lean':
                  blocks = extract_lean(rel, text)
              elif suffix in {'.sh', '.bash', '.zsh', '.yml', '.yaml', '.toml', '.cfg', '.ini'}:
                  blocks = extract_hash_comments(rel, text)
              elif suffix in {'.md', '.rst', '.txt', '.html', '.htm', '.tex', '.bib', '.cff'} or path.name in {'README', 'LICENSE'}:
                  blocks = [(1, 'full_human_facing_text', text.strip())]
              for ln, kind, block in blocks:
                  if block:
                      prose_blocks.append((rel, ln, kind, block))

          out = []
          out.append('FULL REPOSITORY TEXT AND COMMENT AUDIT')
          out.append('=' * 80)
          out.append(f'Tracked files: {len(tracked)}')
          out.append(f'UTF-8 text files: {len(text_files)}')
          out.append(f'Binary/non-UTF8 files: {len(binary_files)}')
          out.append(f'Forbidden/internal hits: {len(forbidden_hits)}')
          out.append(f'Binary printable-string hits: {len(binary_string_hits)}')
          out.append(f'Style-phrase hits: {len(style_hits)}')
          out.append(f'Extracted prose/comment blocks: {len(prose_blocks)}')
          out.append('')

          out.append('[EXTENSION COUNTS]')
          for ext, count in sorted(extension_counts.items()):
              out.append(f'{ext}\t{count}')
          out.append('')

          out.append('[ALL TRACKED FILES]')
          out.extend(tracked)
          out.append('')

          out.append('[TEXT FILES: path | bytes | lines]')
          for item in text_files:
              out.append('\t'.join(map(str, item)))
          out.append('')

          out.append('[BINARY/NON-UTF8 FILES: path | bytes]')
          for item in binary_files:
              out.append('\t'.join(map(str, item)))
          out.append('')

          out.append('[FORBIDDEN OR INTERNAL-PROCESS HITS]')
          if forbidden_hits:
              for rel, ln, name, snippet in forbidden_hits:
                  out.append(f'{rel}:{ln}\t{name}\t{snippet}')
          else:
              out.append('NONE')
          out.append('')

          out.append('[BINARY PRINTABLE-STRING HITS]')
          if binary_string_hits:
              for rel, name, snippet in binary_string_hits:
                  out.append(f'{rel}\t{name}\t{snippet}')
          else:
              out.append('NONE')
          out.append('')

          out.append('[STYLE-PHRASE HITS]')
          if style_hits:
              for rel, ln, name, snippet in style_hits:
                  out.append(f'{rel}:{ln}\t{name}\t{snippet}')
          else:
              out.append('NONE')
          out.append('')

          out.append('[EXTRACTED HUMAN-FACING PROSE, COMMENTS, DOCSTRINGS, AND NOTEBOOK METADATA]')
          for rel, ln, kind, block in prose_blocks:
              out.append('-' * 80)
              out.append(f'FILE: {rel} | LOCATION: {ln} | KIND: {kind}')
              out.append(block)
          out.append('')

          REPORT.write_text('\n'.join(out), encoding='utf-8')
          print(f'Wrote {REPORT} with {len(out)} report records')
          PY

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .repository-text-audit.txt
          git commit -m "Generate temporary repository text audit"
          git push
