name: Rename interactive display directory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename-interactive-display.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename directory and update references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          old_name = "Quantum turing patterns-" + "1.0.0"
          new_name = "interactive-display"
          old_dir = Path(old_name)
          new_dir = Path(new_name)

          if old_dir.exists():
              if new_dir.exists():
                  raise SystemExit(f"Both {old_dir} and {new_dir} exist")
              subprocess.run(["git", "mv", str(old_dir), str(new_dir)], check=True)
          elif not new_dir.exists():
              raise SystemExit(f"Neither {old_dir} nor {new_dir} exists")

          old_url = old_name.replace(" ", "%20")
          replacements = ((old_name, new_name), (old_url, new_name))

          changed: list[str] = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for rel in tracked:
              if not rel:
                  continue
              path = Path(rel)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data[:8192]:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for before, after in replacements:
                  updated = updated.replace(before, after)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(rel)

          print(f"Renamed {old_name!r} to {new_name!r}")
          print("Updated textual references:")
          for rel in changed:
              print(f"  {rel}")
          PY

      - name: Refresh display manifests
        shell: bash
        run: |
          set -euo pipefail
          cd interactive-display
          python make_manifest.py .
          python verify_release.py --pristine

      - name: Validate repository paths
        shell: bash
        run: |
          set -euo pipefail
          test -d interactive-display
          test ! -e "Quantum turing patterns-1.0.0"

          if git grep -n -I -e "Quantum turing patterns-1.0.0" -e "Quantum%20turing%20patterns-1.0.0" -- .; then
            echo "Old directory references remain."
            exit 1
          fi

          python -m compileall -q interactive-display reproduction

          test -f interactive-display/qtp_explorer.ipynb
          test -f interactive-display/display/display_labyrinth_pattern.mp4
          test -f interactive-display/verify_release.py

      - name: Commit rename
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Repository is already normalized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename display package to interactive-display"
          git push
